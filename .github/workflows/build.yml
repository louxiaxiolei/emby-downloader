name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.7"
          cache: true
      - run: flutter pub get
      - name: Download libmpv through the GitHub API
        run: python3 tool/patch_mpv_symlinks.py
      - run: flutter analyze
      - run: flutter test
      - name: Remux a sample MKV with ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          bash tool/remux_sample.sh
      - name: Seed the Kotlin compiler from Maven Central
        run: |
          set -euo pipefail
          base=android/local-m2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.0.21
          mkdir -p "$base"
          fetch() {
            local name="$1"
            shift
            local url
            for url in "$@"; do
              if curl --retry 5 --retry-all-errors --retry-delay 2 -fL --max-time 180 -o "$base/$name" "$url"; then
                return 0
              fi
              echo "failed $url"
            done
            return 1
          }
          fetch kotlin-compiler-embeddable-2.0.21.pom \
            https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.0.21/kotlin-compiler-embeddable-2.0.21.pom \
            https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.0.21/kotlin-compiler-embeddable-2.0.21.pom
          fetch kotlin-compiler-embeddable-2.0.21.jar \
            https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.0.21/kotlin-compiler-embeddable-2.0.21.jar \
            https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.0.21/kotlin-compiler-embeddable-2.0.21.jar \
            https://repo.huaweicloud.com/repository/maven/org/jetbrains/kotlin/kotlin-compiler-embeddable/2.0.21/kotlin-compiler-embeddable-2.0.21.jar
      - name: Build split APKs
        run: |
          set -euo pipefail
          # services.gradle.org redirects to a GitHub release that is returning 503/504.
          python3 tool/use_gradle_mirror.py
          flutter build apk --release --split-per-abi
      - name: Name release APKs
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifacts/emby-downloader.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifacts/emby-downloader-armeabi-v7a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: emby-downloader-apk
          path: artifacts/emby-downloader.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: emby-downloader-armeabi-v7a-apk
          path: artifacts/emby-downloader-armeabi-v7a.apk
          if-no-files-found: error

  ios-unsigned-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.7"
          cache: true
      - run: flutter pub get
      - name: Patch the mpv framework symlink script
        run: |
          python3 tool/patch_mpv_symlinks.py
          dir=$(echo "$HOME"/.pub-cache/hosted/pub.dev/media_kit_libs_ios_video-*/ios)
          make -C "$dir"
          find "$dir/Frameworks/.symlinks/mpv" -maxdepth 2 -print
      - name: Build unsigned iOS
        run: flutter build ios --release --no-codesign
      - name: Pack unsigned IPA
        run: bash tool/pack_unsigned_ipa.sh build/ios/iphoneos/Runner.app artifacts/emby-downloader.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: emby-downloader-ipa
          path: artifacts/emby-downloader.ipa
          if-no-files-found: error
      - name: Report IPA size
        run: ls -lh artifacts/emby-downloader.ipa

  release:
    needs: [android, ios-unsigned-ipa]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish a rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out
          ipa="$(find dist -type f -name 'emby-downloader.ipa' -print -quit)"
          apk="$(find dist -type f -name 'emby-downloader.apk' -print -quit)"
          v7="$(find dist -type f -name 'emby-downloader-armeabi-v7a.apk' -print -quit)"
          test -n "$ipa" && test -n "$apk"
          cp "$ipa" out/emby-downloader.ipa
          cp "$apk" out/emby-downloader.apk
          if [ -n "$v7" ]; then cp "$v7" out/emby-downloader-armeabi-v7a.apk; fi
          gh release delete continuous --yes --cleanup-tag || true
          gh release create continuous out/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Continuous build" \
            --notes "Unsigned iOS IPA (emby-downloader.ipa) and arm64 APK (emby-downloader.apk). The IPA is built with flutter build ios --release --no-codesign and is a zip of Payload/Runner.app."
